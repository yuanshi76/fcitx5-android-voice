[versions]
# 与 fcitx5-android master 保持一致的已验证版本组合
agp = "9.4.1"
kotlin = "2.4.10"
appcompat = "1.7.0"
preference = "1.2.1"

[libraries]
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
